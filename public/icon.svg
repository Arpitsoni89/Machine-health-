<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4" />

  <!-- Central Industrial AI Processor Core -->
  <rect x="136" y="136" width="240" height="240" rx="36" fill="url(#chipGrad)" stroke="#38bdf8" stroke-width="6" />

  <!-- Chip Connector Pins -->
  <!-- Top Pins -->
  <rect x="180" y="112" width="16" height="24" rx="4" fill="#38bdf8" />
  <rect x="216" y="112" width="16" height="24" rx="4" fill="#38bdf8" />
  <rect x="252" y="112" width="16" height="24" rx="4" fill="#38bdf8" />
  <rect x="288" y="112" width="16" height="24" rx="4" fill="#38bdf8" />
  <rect x="324" y="112" width="16" height="24" rx="4" fill="#38bdf8" />

  <!-- Bottom Pins -->
  <rect x="180" y="376" width="16" height="24" rx="4" fill="#38bdf8" />
  <rect x="216" y="376" width="16" height="24" rx="4" fill="#38bdf8" />
  <rect x="252" y="376" width="16" height="24" rx="4" fill="#38bdf8" />
  <rect x="288" y="376" width="16" height="24" rx="4" fill="#38bdf8" />
  <rect x="324" y="376" width="16" height="24" rx="4" fill="#38bdf8" />

  <!-- Left Pins -->
  <rect x="112" y="180" width="24" height="16" rx="4" fill="#38bdf8" />
  <rect x="112" y="216" width="24" height="16" rx="4" fill="#38bdf8" />
  <rect x="112" y="252" width="24" height="16" rx="4" fill="#38bdf8" />
  <rect x="112" y="288" width="24" height="16" rx="4" fill="#38bdf8" />
  <rect x="112" y="324" width="24" height="16" rx="4" fill="#38bdf8" />

  <!-- Right Pins -->
  <rect x="376" y="180" width="24" height="16" rx="4" fill="#38bdf8" />
  <rect x="376" y="216" width="24" height="16" rx="4" fill="#38bdf8" />
  <rect x="376" y="252" width="24" height="16" rx="4" fill="#38bdf8" />
  <rect x="376" y="288" width="24" height="16" rx="4" fill="#38bdf8" />
  <rect x="376" y="324" width="24" height="16" rx="4" fill="#38bdf8" />

  <!-- Telemetry Vibration Waveform Path with Glow -->
  <path d="M 160 256 L 190 256 L 210 210 L 230 295 L 256 185 L 282 325 L 302 230 L 322 256 L 352 256" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Precision Node Indicator Dots -->
  <circle cx="256" cy="185" r="8" fill="#10b981" />
  <circle cx="282" cy="325" r="8" fill="#38bdf8" />
  <circle cx="210" cy="210" r="6" fill="#06b6d4" />
</svg>
